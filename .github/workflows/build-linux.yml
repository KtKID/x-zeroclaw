name: Build Linux

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+-linux"
            - "v[0-9]+.[0-9]+.[0-9]+-linux-*"

concurrency:
    group: build-linux-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write

env:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: core.hooksPath
    GIT_CONFIG_VALUE_0: /dev/null
    CARGO_TERM_COLOR: always

jobs:
    build-linux:
        name: Build (Linux x86_64)
        runs-on: ubuntu-22.04
        timeout-minutes: 35

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0

            - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v3
              with:
                  prefix-key: build-linux

            - name: Build binary
              run: cargo build --profile dist --locked --verbose

            - name: Rename binary
              run: cp target/dist/zeroclaw zeroclaw-linux-x86_64

            - name: Upload to GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ github.ref_name }}"
                  gh release upload "$TAG" zeroclaw-linux-x86_64 --clobber
